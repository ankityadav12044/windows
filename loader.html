<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium uPVC Loader</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fa;
}

/* Loader */
.loader-screen{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#ff7a1a22,transparent 40%),
    radial-gradient(circle at bottom right,#ff7a1a22,transparent 40%),
    #0a11284b;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    overflow:hidden;
}

.loader-card{
    text-align:center;
}

.window{
    width:140px;
    height:140px;
    margin:auto;
    position:relative;
    animation:float 3s ease-in-out infinite;
}

.frame{
    width:100%;
    height:100%;
    border:4px solid #ff7a1a;
    border-radius:18px;
    position:relative;
    overflow:hidden;
    box-shadow:
    0 0 30px rgba(255,122,26,.4),
    inset 0 0 25px rgba(255,122,26,.15);
}

.frame::before{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    width:3px;
    height:100%;
    background:#ff7a1a;
    transform:translateX(-50%);
}

.frame::after{
    content:"";
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:3px;
    background:#ff7a1a;
    transform:translateY(-50%);
}

.glass{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        120deg,
        transparent 20%,
        rgba(255,255,255,.35) 50%,
        transparent 80%
    );
    animation:shine 2.5s linear infinite;
}

.ring{
    position:absolute;
    inset:-20px;
    border-radius:50%;
    border:2px dashed rgba(255,122,26,.4);
    animation:rotate 8s linear infinite;
}

h1{
    color:#fff;
    margin-top:35px;
    font-size:28px;
    letter-spacing:4px;
    font-weight:700;
    display:none;
}

p{
    color:#fff;
    margin-top:30px;
    font-size:14px;
}

.loading{
    margin-top:25px;
    width:260px;
    height:8px;
    background:rgba(255,255,255,.08);
    border-radius:50px;
    overflow:hidden;
}

.loading span{
    display:block;
    height:100%;
    width:0%;
    background:
    linear-gradient(
        90deg,
        #ff7a1a,
        #ffb067
    );
    border-radius:50px;
}

.percent{
    color:#ff7a1a;
    font-size:18px;
    font-weight:600;
    margin-top:15px;
}

@keyframes rotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes shine{
    from{
        transform:translateX(-120%);
    }
    to{
        transform:translateX(120%);
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-10px);
    }
}
</style>
</head>
<body>

<div class="loader-screen" id="loader">

    <div class="loader-card">

        <div class="window">

            <div class="ring"></div>

            <div class="frame">
                <div class="glass"></div>
            </div>

        </div>

        <h1>UPVC WINDOWS</h1>

        <p>Crafting Premium Views For Modern Homes</p>

        <div class="loading">
            <span id="progress"></span>
        </div>

        <div class="percent" id="percent">0%</div>

    </div>

</div>

<script>
let count = 0;

const percent = document.getElementById("percent");
const progress = document.getElementById("progress");
const loader = document.getElementById("loader");

const interval = setInterval(() => {

    count++;

    percent.innerHTML = count + "%";
    progress.style.width = count + "%";

    if(count >= 100){

        clearInterval(interval);

        setTimeout(() => {

            loader.style.transition = "all .8s ease";
            loader.style.opacity = "0";
            loader.style.visibility = "hidden";

        },300);

    }

},20);
</script>

</body>
</html>
