<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
    margin:0;
    background:#07182f;
}

.loader{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #07182f,
        #0d2d57
    );
    z-index:9999;
}

.window{
    width:180px;
    height:180px;
    border:8px solid #fff;
    position:relative;
    overflow:hidden;
    border-radius:12px;
    box-shadow:
    0 0 40px rgba(255,255,255,.15),
    0 0 80px rgba(0,153,255,.2);
}

.window::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:6px;
    height:100%;
    background:#fff;
    transform:translateX(-50%);
}

.window::after{
    content:"";
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:6px;
    background:#fff;
    transform:translateY(-50%);
}

.glass{
    position:absolute;
    background:linear-gradient(
        135deg,
        #dff6ff,
        #7fd9ff
    );
}

.glass-left{
    width:50%;
    height:50%;
    top:0;
    left:0;
}

.glass-right{
    width:50%;
    height:50%;
    top:0;
    right:0;
}

.shine{
    position:absolute;
    top:-50%;
    left:-120%;
    width:60px;
    height:300%;
    background:rgba(255,255,255,.4);
    transform:rotate(25deg);
    animation:shine 2s infinite;
}

@keyframes shine{

    0%{
        left:-120%;
    }

    100%{
        left:160%;
    }

}

.loader h2{
    margin-top:30px;
    color:#fff;
    letter-spacing:5px;
    font-size:24px;
}

.loader p{
    color:#9fb7d1;
    margin-top:8px;
    letter-spacing:2px;
}

.loader::after{
    content:"";
    width:180px;
    height:4px;
    margin-top:25px;
    border-radius:50px;
    background:rgba(255,255,255,.15);
    position:relative;
}

.loader::before{
    content:"";
    width:0;
    height:4px;
    margin-top:340px;
    position:absolute;
    background:#3bb3ff;
    border-radius:50px;
    animation:progress 2.5s infinite;
}

@keyframes progress{

    0%{
        width:0;
    }

    100%{
        width:180px;
    }

}
    </style>
</head>
<body>
    <div class="loader">

    <div class="window">

        <div class="glass glass-left"></div>
        <div class="glass glass-right"></div>

        <div class="shine"></div>

    </div>

    <h2>UPVC WINDOWS</h2>
    <p>Crafting Better Views</p>

</div>
</body>
</html>
