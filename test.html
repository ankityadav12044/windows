<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uPVC Statistics Dashboard</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #16365D; 
            --primary-orange: #E26A2C; 
            --bg-color: #F8F9FA; 
            --divider-color: #D1D5DB; 
        }
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #fff;
        }
        .stats-section {
            background-color: var(--bg-color);
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px 0; 
            max-width: 1200px;
            width: 100%;
        }
        .stat-item {
            text-align: center;
            padding: 0 20px;
            border-right: 1px solid var(--divider-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-item:nth-child(4) {
            border-right: none;
        }
        .stat-number-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
        }
        .stat-label {
            color: var(--primary-orange);
            font-size: 16px;
            font-weight: 400;
            margin: 0;
        }
        @media (max-width: 992px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 50px 0;
            }
            .stat-item { border-right: 1px solid var(--divider-color); }
            .stat-item:nth-child(2n) { border-right: none; }
        }
        @media (max-width: 576px) {
            .stats-grid { grid-template-columns: 1fr; gap: 40px 0; }
            .stat-item { border-right: none; border-bottom: 1px solid var(--divider-color); padding-bottom: 30px; }
            .stat-item:last-child { border-bottom: none; padding-bottom: 0; }
        }
    </style>
</head>
<body>

    <section class="stats-section">
        <div class="stats-grid">
            <!-- Row 1 Items -->
            <div class="stat-item">
                <div class="stat-number-wrapper">1250+</div>
                <p class="stat-label">Completed Projects</p>
            </div>
            <div class="stat-item">
                <div class="stat-number-wrapper">180+</div>
                <p class="stat-label">Happy Clients</p>
            </div>
            <div class="stat-item">
                <div class="stat-number-wrapper">85+</div>
                <p class="stat-label">Expert Team</p>
            </div>
            <div class="stat-item">
                <div class="stat-number-wrapper">58+</div>
                <p class="stat-label">Awards Won</p>
            </div>
            
            <!-- Row 2 Items -->
            <div class="stat-item">
                <div class="stat-number-wrapper">40+</div>
                <p class="stat-label">dB Noise Reduction</p>
            </div>
            <div class="stat-item">
                <div class="stat-number-wrapper">10,000+</div>
                <p class="stat-label">uPVC Units Installed</p>
            </div>
            <div class="stat-item">
                <div class="stat-number-wrapper">25+</div>
                <p class="stat-label">Regions Covered</p>
            </div>
            <div class="stat-item">
                <div class="stat-number-wrapper">10+</div>
                <p class="stat-label">Years Warranty</p>
            </div>
        </div>
    </section>

</body>
</html>
